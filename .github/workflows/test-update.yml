name: Find Stephen Wolfram interview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install search package
        run: |
          python -m pip install --upgrade ddgs

      - name: Search the web
        run: |
          python - <<'PY'
          from ddgs import DDGS
          from pathlib import Path
          from datetime import datetime, timezone
          import html

          query = '"Stephen Wolfram" interview podcast'

          print(f"Searching for: {query}")

          results = list(
              DDGS().text(
                  query,
                  region="us-en",
                  max_results=10
              )
          )

          if not results:
              raise RuntimeError("No search results found.")

          # Print results into the GitHub Actions log
          for i, result in enumerate(results, start=1):
              print(f"\nRESULT {i}")
              print("Title:", result.get("title"))
              print("URL:", result.get("href"))
              print("Snippet:", result.get("body"))

          # For this mini test, take the first result.
          result = results[0]

          title = result.get("title", "Untitled result")
          url = result.get("href", "")
          snippet = result.get("body", "")
          searched = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          # Escape characters that might interfere with Markdown/HTML.
          title = html.escape(title)
          snippet = html.escape(snippet)

          new_section = f"""<!-- AUTO-UPDATE-START -->

          ### Latest search result

          **{title}**

          {snippet}

          [Open source]({url})

          _Web search performed: {searched}_

          <!-- AUTO-UPDATE-END -->"""

          path = Path("people/001-stephen-wolfram.md")
          text = path.read_text(encoding="utf-8")

          start = "<!-- AUTO-UPDATE-START -->"
          end = "<!-- AUTO-UPDATE-END -->"

          if start not in text or end not in text:
              raise RuntimeError("AUTO-UPDATE markers not found.")

          before = text.split(start, 1)[0]
          after = text.split(end, 1)[1]

          path.write_text(
              before + new_section + after,
              encoding="utf-8"
          )

          print("\nSELECTED RESULT:")
          print(title)
          print(url)
          PY

      - name: Commit result
        run: |
          git config user.name "infppl-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add people/001-stephen-wolfram.md

          if git diff --cached --quiet; then
            echo "No changes found."
          else
            git commit -m "Update Stephen Wolfram latest web result"
            git pull --rebase origin main
            git push origin main
          fi
