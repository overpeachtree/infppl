name: Find Stephen Wolfram interview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade yt-dlp

      - name: Find recent Stephen Wolfram video
        run: |
          python - <<'PY'
          import subprocess
          import json
          from pathlib import Path

          query = 'ytsearch20:Stephen Wolfram interview podcast'

          result = subprocess.run(
              [
                  "yt-dlp",
                  "--dump-json",
                  "--skip-download",
                  "--ignore-errors",
                  query
              ],
              capture_output=True,
              text=True
          )

          videos = []

          for line in result.stdout.splitlines():
              try:
                  data = json.loads(line)
              except json.JSONDecodeError:
                  continue

              title = data.get("title")
              url = data.get("webpage_url")
              upload_date = data.get("upload_date")
              channel = data.get("channel") or data.get("uploader")

              if title and url and upload_date:
                  videos.append({
                      "title": title,
                      "url": url,
                      "date": upload_date,
                      "channel": channel or "Unknown"
                  })

          if not videos:
              raise RuntimeError("No usable videos found.")

          # newest upload first
          videos.sort(key=lambda x: x["date"], reverse=True)

          newest = videos[0]

          date = newest["date"]
          formatted_date = f"{date[:4]}-{date[4:6]}-{date[6:]}"

          markdown = f"""<!-- AUTO-UPDATE-START -->

          ### {formatted_date} — {newest['title']}

          - Platform: YouTube
          - Channel: {newest['channel']}
          - Published: {formatted_date}
          - [Watch interview]({newest['url']})

          <!-- AUTO-UPDATE-END -->"""

          path = Path("people/001-stephen-wolfram.md")
          text = path.read_text()

          start = "<!-- AUTO-UPDATE-START -->"
          end = "<!-- AUTO-UPDATE-END -->"

          before = text.split(start)[0]
          after = text.split(end)[1]

          path.write_text(before + markdown + after)

          print("FOUND:")
          print(newest)
          PY

      - name: Commit result
        run: |
          git config user.name "infppl-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add people/001-stephen-wolfram.md

          if git diff --cached --quiet; then
            echo "No changes found."
          else
            git commit -m "Update Stephen Wolfram latest interview"
            git push
          fi
